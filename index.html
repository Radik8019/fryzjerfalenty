<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Prywatne atelier haute coiffure Radosława Kostiwa. Koloryzacja, cięcie i stylizacja. Falenty Nowe · Warszawa."
    />
    <meta property="og:title" content="Radosław Kostiw — Fryzjer Falenty Nowe · Warszawa" />
    <meta
      property="og:description"
      content="Kolor, cięcie i forma — dla kobiet, które nie godzą się na kompromis."
    />
    <meta property="og:type" content="website" />
    <title>Radosław Kostiw — Fryzjer Falenty Nowe · Warszawa</title>
    <script>
      try {
        var t = localStorage.getItem('rk-theme-v2') || 'dark'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#05070f' : '#f5f2ec')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
